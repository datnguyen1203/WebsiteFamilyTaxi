<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A3D62"/>
      <stop offset="100%" stop-color="#00153A"/>
    </linearGradient>
  </defs>
  <rect width="720" height="440" fill="url(#g)"/>
  <!-- Grid pattern -->
  <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </pattern>
  <rect width="720" height="440" fill="url(#p)"/>
  <!-- Center content -->
  <text x="360" y="204" text-anchor="middle" font-family="'Be Vietnam Pro',Arial,sans-serif"
        font-size="22" font-weight="700" fill="rgba(255,255,255,0.9)">Đưa Đón Sân Bay</text>
  <text x="360" y="238" text-anchor="middle" font-family="'Be Vietnam Pro',Arial,sans-serif"
        font-size="13" fill="rgba(255,255,255,0.6)">Sân bay Tân Sơn Nhất</text>
  <!-- Camera icon -->
  <g transform="translate(340, 252)">
    <rect x="0" y="4" width="40" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <circle cx="20" cy="18" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <rect x="12" y="0" width="16" height="6" rx="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>
  <text x="360" y="424" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="11" fill="rgba(255,255,255,0.4)">Thay bằng ảnh thực tế</text>
</svg>